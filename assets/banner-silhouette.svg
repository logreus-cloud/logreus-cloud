<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Ligreus — student developer, vibe-coding, hackathons">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121215"/>
      <stop offset="0.55" stop-color="#0d0d10"/>
      <stop offset="1" stop-color="#17171b"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="1" stop-color="#0e0e11"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="eyeGlow">
      <stop offset="0" stop-color="#ff2f3d" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff2f3d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>

    <!-- scanlines -->
    <g fill="#ffffff" opacity="0.028">
      <rect x="0" y="0"   width="1200" height="2"/><rect x="0" y="16"  width="1200" height="2"/>
      <rect x="0" y="32"  width="1200" height="2"/><rect x="0" y="48"  width="1200" height="2"/>
      <rect x="0" y="64"  width="1200" height="2"/><rect x="0" y="80"  width="1200" height="2"/>
      <rect x="0" y="96"  width="1200" height="2"/><rect x="0" y="112" width="1200" height="2"/>
      <rect x="0" y="128" width="1200" height="2"/><rect x="0" y="144" width="1200" height="2"/>
      <rect x="0" y="160" width="1200" height="2"/><rect x="0" y="176" width="1200" height="2"/>
      <rect x="0" y="192" width="1200" height="2"/><rect x="0" y="208" width="1200" height="2"/>
      <rect x="0" y="224" width="1200" height="2"/><rect x="0" y="240" width="1200" height="2"/>
      <rect x="0" y="256" width="1200" height="2"/><rect x="0" y="272" width="1200" height="2"/>
      <rect x="0" y="288" width="1200" height="2"/><rect x="0" y="304" width="1200" height="2"/>
      <rect x="0" y="320" width="1200" height="2"/>
    </g>

    <!-- drifting shards -->
    <g opacity="0.5">
      <polygon points="486,44 520,30 512,62 482,66" fill="#2e2e35"/>
      <polygon points="556,236 588,248 560,268" fill="#26262c"/>
      <polygon points="1044,60 1082,48 1070,86 1040,84" fill="#24242a"/>
      <polygon points="1122,214 1150,206 1146,238 1118,236" fill="#1e1e23"/>
      <polygon points="392,268 418,258 414,286" fill="#22222a"/>
      <polygon points="880,286 906,296 882,308" fill="#1d1d22"/>
      <rect x="640" y="94" width="26" height="4" fill="#ff2f3d" opacity="0.55"/>
      <rect x="1096" y="132" width="34" height="3" fill="#8a8a95" opacity="0.45"/>
      <rect x="452" y="186" width="18" height="3" fill="#ff2f3d" opacity="0.35"/>
    </g>

    <!-- portrait: shadowed silhouette, original vector art -->
    <g transform="translate(200,0)">
      <!-- shoulders -->
      <path d="M-134,340 C-124,290 -74,264 -8,260 C60,256 116,284 128,340 Z" fill="#16161c"/>
      <!-- hair silhouette -->
      <path d="M-100,340 C-112,254 -104,176 -82,128 C-62,80 -28,52 2,52 C34,52 70,78 86,130
               C104,180 108,256 98,340 L62,340 C74,280 76,222 68,176 C60,224 56,282 56,340
               L-54,340 C-56,282 -60,224 -68,176 C-76,222 -74,280 -64,340 Z" fill="#101016"/>
      <!-- face in shadow -->
      <path d="M0,92 C38,92 54,124 52,162 C50,206 30,234 0,234 C-30,234 -50,206 -52,162 C-54,124 -38,92 0,92 Z" fill="#20202a"/>
      <path d="M-52,162 C-54,124 -38,92 0,92 C-14,126 -18,182 -8,232 C-32,228 -50,204 -52,162 Z" fill="#1a1a22"/>
      <!-- fringe over the brow -->
      <path d="M-56,170 C-64,112 -34,66 0,66 C34,66 66,112 58,170 C52,128 42,120 32,152
               C26,120 14,112 2,148 C-6,116 -20,108 -30,148 C-42,116 -50,124 -56,170 Z" fill="#0b0b10"/>
      <!-- strands across the face -->
      <path d="M-28,104 C-22,148 -24,196 -32,234 L-26,234 C-18,194 -16,146 -22,102 Z" fill="#0b0b10" opacity="0.85"/>
      <path d="M24,100 C32,146 32,196 26,236 L32,236 C40,194 40,142 30,98 Z" fill="#0b0b10" opacity="0.85"/>
      <!-- eyes -->
      <ellipse cx="-21" cy="166" rx="24" ry="15" fill="url(#eyeGlow)"/>
      <ellipse cx="21"  cy="166" rx="24" ry="15" fill="url(#eyeGlow)"/>
      <path d="M-33,166 C-28,159 -15,158 -9,165 C-16,171 -27,172 -33,166 Z" fill="#ff2f3d"/>
      <path d="M9,165 C15,158 28,159 33,166 C27,172 16,171 9,165 Z" fill="#ff2f3d"/>
      <circle cx="-22" cy="165" r="2" fill="#ffdadd" opacity="0.9"/>
      <circle cx="22"  cy="165" r="2" fill="#ffdadd" opacity="0.9"/>
      <!-- rim light -->
      <path d="M86,130 C104,180 108,256 98,340" fill="none" stroke="#9a9aa6" stroke-opacity="0.26" stroke-width="3"/>
      <path d="M-82,128 C-62,80 -28,52 2,52" fill="none" stroke="#9a9aa6" stroke-opacity="0.16" stroke-width="2"/>
      <!-- glitch slice, kept inside the silhouette -->
      <rect x="-86" y="212" width="172" height="5" fill="#0d0d10"/>
      <rect x="-70" y="212" width="140" height="5" fill="#d8d8de" opacity="0.08"/>
    </g>

    <!-- text block -->
    <g>
      <text x="380" y="126" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="14" fill="#f2f2f5">LIGREUS</text>
      <rect x="380" y="150" width="86" height="4" fill="#ff2f3d"/>
      <rect x="474" y="150" width="240" height="4" fill="#3a3a41"/>
      <text x="380" y="196" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="21" letter-spacing="2" fill="#a8a8b2">student developer &#183; learning in public</text>
      <text x="380" y="230" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1" fill="#6f6f7a">python &#183; javascript &#183; flask &#183; express &#183; ai tooling</text>
      <g font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1">
        <rect x="380" y="256" width="150" height="32" rx="16" fill="#1b1b21" stroke="#2e2e36"/>
        <text x="400" y="277" fill="#c9c9d2">hackathons</text>
        <rect x="542" y="256" width="196" height="32" rx="16" fill="#1b1b21" stroke="#2e2e36"/>
        <text x="562" y="277" fill="#c9c9d2">ship &#8594; then polish</text>
        <rect x="750" y="256" width="140" height="32" rx="16" fill="#1b1b21" stroke="#2e2e36"/>
        <text x="770" y="277" fill="#c9c9d2">vibe-coding</text>
      </g>
    </g>

    <rect x="0" y="0" width="1200" height="340" fill="url(#fade)"/>
    <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#2a2a31"/>
  </g>
</svg>
